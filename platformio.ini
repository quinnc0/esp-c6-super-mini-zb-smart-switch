; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: upload port, upload flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32c6

[env:esp32c6]
; Platform Arduino 3.x compatible C6 (pioarduino)
; Using pioarduino fork for better ESP32C6 + Arduino 3.x support
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitm-1    ; Compatible with ESP32-C6 Super Mini and similar boards (4MB flash)
framework = arduino

; Serial Monitor options
monitor_speed = 115200
monitor_filters = 
    colorize
    default

; Partition table for Zigbee (required for Zigbee stack)
; Use partitions_zigbee.csv for OTA support
; Use partitions_zigbee_simple.csv for single app partition
board_build.partitions = partitions_zigbee.csv

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DZIGBEE_MODE_ED
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; ESP Zigbee SDK paths
    -IC:/Users/cq/.platformio/packages/esp-zigbee-sdk/components/esp-zigbee-lib/include
    -LC:/Users/cq/.platformio/packages/esp-zigbee-sdk/components/esp-zigbee-lib/lib/esp32c6
    -lesp_zb_api.ed
    -lzboss_port.native
    ; ZBOSS library paths
    -IC:/Users/cq/.platformio/packages/esp-zboss-lib/include
    -LC:/Users/cq/.platformio/packages/esp-zboss-lib/lib/esp32c6
    -lzboss_stack.ed
    ; Uncomment for Zigbee Router mode (default is End Device)
    ; -DZIGBEE_MODE_RTR

; Upload options
upload_speed = 921600

; Library dependencies
lib_deps = 
    ; ESP32 Preferences library (built-in with ESP32 platform)
    ; Zigbee libraries are included with ESP32 platform package

; Build options
build_type = release

; Environment for development with debug output
[env:dev]
extends = env:esp32c6
build_type = debug
build_flags = 
    ${env:esp32c6.build_flags}
    -DCORE_DEBUG_LEVEL=3
    -DDEBUG_ENABLED